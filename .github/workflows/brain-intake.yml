# New company data in, actions out.
# A push into inbox/ makes the brain ingest the new files into Snowflake and open one issue per team,
# each written under that team's role. A file it cannot read raises a tooling request to CERATA.
# A push that changes ingest/ (a new reader merged) sends it back for files that were waiting.
name: Brain intake

on:
  push:
    paths: ["inbox/**", "ingest/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write        # to start CERATA when a tool is missing

concurrency:
  group: brain-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.CERATA_API_KEY }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}    # optional: without it, unblock emails are queued, not sent
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Snowflake key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          python -m sf.keyfile "$RUNNER_TEMP/brain_svc_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$RUNNER_TEMP/brain_svc_key.p8" >> "$GITHUB_ENV"
      - name: Read what arrived, ask for tools for what cannot be read, go back for what was waiting
        run: python -W ignore -m core.process --changed --catchup
